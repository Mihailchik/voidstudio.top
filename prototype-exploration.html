<!doctype html>
<!-- PROTOTYPE 2: filmstrip and inspectable collage. Variant 1 remains frozen in design-archive/variant-1. -->
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Void Studio — лента и коллаж</title><link rel="icon" href="assets/img/favicon-64.png"><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/exploration.css"><link rel="stylesheet" href="assets/filmstrip.css"></head>
<body data-mode="film"><header class="top"><a class="brand" href="prototype-personal.html" aria-label="Void Studio — обо мне"></a><div class="ruler" id="ruler" aria-label="Выбрать работу"></div><nav><a href="prototype-personal.html?variant=C">Обо мне</a><a href="prototype-portfolio.html">Проекты ↗</a></nav></header>
<main id="main"><section id="film" aria-label="Лента работ" data-view="index">
  <div class="film-stage" id="film-stage" tabindex="0" aria-label="Тяните ленту в сторону или прокручивайте колесо. Нажмите на изображение, чтобы раскрыть его.">
    <canvas id="film-canvas" aria-hidden="true"></canvas><div class="film-track" id="film-track"></div>
  </div>
  <div class="film-titles" aria-hidden="true"><h1 id="film-title"></h1></div>
  <p class="film-announcement" id="film-announcement" aria-live="polite"></p>
  <div class="film-detail-controls" inert><button id="film-fit" type="button" aria-pressed="false">Показать целиком <span>↗</span></button><button id="film-back" type="button">← К ленте</button></div>
  <p class="film-note">VOID STUDIO . LAB<br>Визуальные исследования</p>
  <p class="film-gesture">Тяни, чтобы листать<br>Нажми, чтобы раскрыть</p>
</section>
<section id="collage" aria-label="Коллаж с линзой" hidden><div class="collage-heading"><div><p class="micro">VOID STUDIO . LAB / АТЛАС ИЗОБРАЖЕНИЙ</p><h1>Чем ближе,<br>тем интереснее.</h1></div><div class="lens-controls"><label for="zoom">Приближение <output id="zoom-label">3×</output></label><input id="zoom" type="range" min="2" max="5" step="0.5" value="3" aria-label="Сила увеличения"><button id="pin-lens" type="button" aria-pressed="false">Закрепить линзу</button></div></div><div id="mosaic-stage" class="mosaic-stage" tabindex="0" aria-label="Коллаж: двигайте курсор или палец, нажмите чтобы открыть работу"><canvas id="mosaic" aria-label="Коллаж из AI-работ Void Studio"></canvas><div id="magnifier" class="magnifier" aria-hidden="true"><canvas id="magnified"></canvas><span class="lens-reticle">+</span><span class="lens-zoom">3×</span></div><button class="mosaic-open" type="button" aria-label="Открыть работу под линзой">Рассмотреть ↗</button></div><div class="mosaic-footer"><span id="mosaic-title">Наведите линзу на детали</span><span>13 исходных работ · повторные фрагменты</span></div><div class="accessible-works" id="accessible-works" aria-label="Все работы коллажа"></div></section></main>
<footer class="foot"><a id="selection-link" href="prototype-selection.html">Подобрать работы ↗</a><div class="mode-switch" aria-label="Выбрать эксперимент"><button data-mode="film" type="button" aria-pressed="true">01 / Лента</button><button data-mode="collage" type="button" aria-pressed="false">02 / Коллаж + линза</button></div><label class="sensitivity">Отклик <input id="sensitivity" type="range" min="0.5" max="1.8" step="0.1" value="1" aria-label="Чувствительность прокрутки"></label></footer>
<dialog id="viewer" aria-label="Просмотр работы"><button class="viewer-close" type="button" aria-label="Закрыть работу">Закрыть ×</button><img id="viewer-image" alt=""><div class="viewer-copy"><p id="viewer-index" class="micro"></p><h2 id="viewer-title"></h2><p>Void Studio . Lab / AI-визуал</p></div><button class="viewer-prev round" type="button" aria-label="Предыдущая работа">←</button><button class="viewer-next round" type="button" aria-label="Следующая работа">→</button></dialog>
<script src="assets/gallery-data.js"></script><script src="assets/filmstrip.js"></script><script src="assets/exploration.js"></script></body></html>
