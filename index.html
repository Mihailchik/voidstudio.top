<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Void Studio . Lab</title>
<meta name="description" content="Void Studio . Lab — скоро.">
<meta name="theme-color" content="#f7f6f3">
<meta name="robots" content="noindex">

<link rel="icon" href="assets/img/favicon-64.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

<style>
  html { color-scheme: light; }
  body {
    margin: 0; min-height: 100dvh;
    display: grid; place-content: center; justify-items: center;
    gap: 26px; padding: 24px;
    background: #f7f6f3; color: #16161a;
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Логотип разобран на два знака: кот и надпись. Оба — PNG-маски,
     поэтому красятся одной строкой и живут на любом фоне. */
  .cat, .word { background: #16161a; }
  .cat {
    width: 148px; aspect-ratio: 1;
    -webkit-mask: url(assets/img/logo-cat.png) no-repeat center / contain;
    mask: url(assets/img/logo-cat.png) no-repeat center / contain;
  }
  .word {
    width: min(300px, 68vw); aspect-ratio: 1027 / 133;
    -webkit-mask: url(assets/img/logo-word.png) no-repeat center / contain;
    mask: url(assets/img/logo-word.png) no-repeat center / contain;
  }

  p { margin: 0; color: #8f8b82; letter-spacing: .14em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="cat" role="img" aria-label="Void Studio . Lab"></div>
  <div class="word" aria-hidden="true"></div>
  <p>Скоро</p>
</body>
</html>
