  <script>
    const ids = selectedGalleryIds();
    const works = (ids.length ? ids : suggestedGalleryIds)
      .map(id => galleryWorks.find(work => work.id === id))
      .filter(Boolean);
    const filmController = createFilmstrip(works, {
      reduced: matchMedia('(prefers-reduced-motion: reduce)').matches
    });
    filmController.setActive(true);
  </script>
